services:
  postgres:
    image: postgres:16-alpine
    container_name: chihuahuenos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chihuahuenos
      POSTGRES_PASSWORD: chihuahuenos_secret
      POSTGRES_DB: chihuahuenos_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chihuahuenos -d chihuahuenos_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chihuahuenos_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chihuahuenos_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: chihuahuenos
      DB_PASSWORD: chihuahuenos_secret
      DB_NAME: chihuahuenos_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_IN_MEMORY_DB: 'false'
    ports:
      - '4000:4000'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: chihuahuenos_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      INTERNAL_API_URL: http://backend:4000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
